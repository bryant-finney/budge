# Pull-request CI: shared pre-commit checks and all test suites. `ci-ok` aggregates every job and
# is the single required status check on `main` (share/skills/apply-repo-rules/rules.md).
# ref: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - run: python -m pip install pre-commit==4.7.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: typescript
          - suite: python
            python: "3.11"
          - suite: python
            python: "3.12"
          - suite: python
            python: "3.13"
          - suite: python
            python: "3.14"
          - suite: python
            python: "3.15"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - if: matrix.suite == 'typescript'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - if: matrix.suite == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: matrix.suite == 'typescript'
        run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'typescript'
        run: pnpm run test
      - if: matrix.suite == 'typescript'
        run: pnpm -r --if-present run build
      - if: matrix.suite == 'python'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version-file: src/back-end/pyproject.toml
          enable-cache: true
          cache-dependency-glob: src/back-end/uv.lock
          cache-suffix: py${{ matrix.python }}
      - if: matrix.suite == 'python'
        run: uv sync --directory src/back-end --locked --all-groups
      - if: matrix.suite == 'python'
        run: >-
          uv run --directory src/back-end --locked
          pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
      - if: ${{ matrix.suite == 'python' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: py-test-reports-${{ matrix.python }}
          path: src/back-end/reports/
          if-no-files-found: warn

  # The one required status check. Matrix contexts are named per entry (`test (python, 3.12)`), so
  # requiring them directly means editing the ruleset with every matrix change. `needs.test.result`
  # is already the aggregate over every matrix entry. `always()` keeps this job from being skipped:
  # GitHub counts a skipped required check as passing. Any result other than `success` fails it,
  # `skipped` included: no needed job has an `if:` or path filter, so a skip means something
  # upstream broke. Add every new job to `needs`; never give this job a `name:`, path filter, or
  # other skip condition.
  ci-ok:
    needs: [pre-commit, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq '.' <<<"$RESULTS"
          jq --exit-status 'all(.[]; .result == "success")' <<<"$RESULTS"
