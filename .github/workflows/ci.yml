# ref: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# pattern: object keys are sorted alphabetically
concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  # The only required status check (rules.md). A skipped required check counts as passing.
  ci-ok:
    env:
      RESULTS: ${{ toJSON(needs) }}
    if: always()
    needs: [pre-commit, test]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Show needed job results
        run: jq . <<<"$RESULTS"
      - name: Fail unless every needed job succeeded
        run: jq --exit-status 'all(.[]; .result == "success")' <<<"$RESULTS"

  pre-commit:
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - run: python -m pip install pre-commit==4.7.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: pre-commit-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ hashFiles('.pre-commit-config.yaml') }}
          path: ~/.cache/pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    env:
      UV_PYTHON: ${{ matrix.python }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - if: matrix.suite == 'typescript'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - if: matrix.suite == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - if: matrix.suite == 'typescript'
        run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'typescript'
        run: pnpm run test
      - if: matrix.suite == 'typescript'
        run: pnpm -r --if-present run build
      - if: matrix.suite == 'python'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          cache-dependency-glob: src/back-end/uv.lock
          cache-suffix: py${{ matrix.python }}
          enable-cache: true
          version-file: src/back-end/pyproject.toml
      - if: matrix.suite == 'python'
        run: uv sync --directory src/back-end --locked --all-groups
      - if: matrix.suite == 'python'
        run: >-
          uv run --directory src/back-end --locked
          pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
      - if: ${{ matrix.suite == 'python' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          if-no-files-found: warn
          name: py-test-reports-${{ matrix.python }}
          path: src/back-end/reports/
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: typescript
          - python: "3.11"
            suite: python
          - python: "3.12"
            suite: python
          - python: "3.13"
            suite: python
          - python: "3.14"
            suite: python
          - python: "3.15"
            suite: python

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:

permissions: {}
