repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: '\.pdf$'
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
        name: check yaml (pnpm-lock.yaml, multi-document)
        # pnpm 12 writes pnpm-lock.yaml as two YAML documents
        files: ^pnpm-lock\.yaml$
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # direnv sources .envrc; its shebang only tells shellcheck the dialect
        exclude: ^\.envrc$

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-footnote
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-tables
          - mdformat-wikilink

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        exclude: ^src/back-end/uv\.lock$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # shellchecks `run:` blocks only if a shellcheck binary is on PATH (not the hook env above)
      - id: actionlint

  # infra (src/infrastructure) plus the shared Prettier hook for both TS packages.
  # language: system: needs Node 24 + pnpm on PATH.
  - repo: local
    hooks:
      - id: pnpm-install
        name: install locked pnpm workspace
        language: system
        entry: pnpm install --frozen-lockfile
        always_run: true
        pass_filenames: false
      - id: prettier
        name: prettier (src/front-end, src/infrastructure)
        language: system
        entry: pnpm exec prettier --write
        # by extension: identify doesn't tag .mts/.cts as ts
        files: ^src/(front-end|infrastructure)/.*\.(ts|mts|cts|js|mjs|cjs|svelte|css|html)$
      - id: infrastructure-eslint
        name: eslint (src/infrastructure)
        language: system
        entry: pnpm -C src/infrastructure run lint
        # also on dependency and tsconfig changes: typed linting reads them
        files: &infrastructure-inputs |
          (?x)^(
            src/infrastructure/(.*\.(ts|mts|cts|js|mjs|cjs)|(package|tsconfig[^/]*)\.json)
            |pnpm-lock\.yaml
            |tsconfig\.base\.json
          )$
        pass_filenames: false
      - id: infrastructure-tsc
        name: tsc (src/infrastructure)
        language: system
        entry: pnpm -C src/infrastructure run check
        files: *infrastructure-inputs
        pass_filenames: false

  # back end (src/back-end).
  - repo: local
    hooks:
      # ruff: `--project` keeps the cwd at the repo root, where pre-commit's filenames are relative to; ruff finds
      # `src/back-end/pyproject.toml` and `tests/ruff.toml` per file. `check --fix` runs before `format`, per ruff
      - id: ruff-check
        name: ruff check (src/back-end)
        language: python
        additional_dependencies: &uv [uv==0.13.6]
        entry: uv run -q --project src/back-end --locked ruff check --fix --force-exclude
        types_or: [python, pyi]
        files: ^src/back-end/
        # one ruff run (it parallelizes itself), not one `uv run` per batch of files
        require_serial: true
      - id: ruff-format
        name: ruff format (src/back-end)
        language: python
        additional_dependencies: *uv
        entry: uv run -q --project src/back-end --locked ruff format --force-exclude
        types_or: [python, pyi]
        files: ^src/back-end/
        require_serial: true
      # type checkers: `--directory` makes `src/back-end` the cwd so each finds its pyproject.toml config, and each
      # checks the whole project once (`pass_filenames: false`): per-file runs give false positives
      - id: mypy
        name: mypy (src/back-end)
        language: python
        additional_dependencies: *uv
        entry: uv run -q --directory src/back-end --locked mypy
        files: &back-end-inputs ^src/back-end/(.*\.pyi?|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pyright
        name: pyright (src/back-end)
        language: python
        additional_dependencies: *uv
        entry: uv run -q --directory src/back-end --locked pyright
        files: *back-end-inputs
        pass_filenames: false
      - id: ty
        name: ty (src/back-end)
        language: python
        additional_dependencies: *uv
        entry: uv run -q --directory src/back-end --locked ty check
        files: *back-end-inputs
        pass_filenames: false
      - id: pylint
        name: pylint (src/back-end)
        language: python
        additional_dependencies: *uv
        entry: uv run -q --directory src/back-end --locked pylint --exit-zero budge tests
        files: *back-end-inputs
        pass_filenames: false
        verbose: true

  - repo: local
    hooks:
      - id: front-end-eslint
        name: eslint (src/front-end)
        language: system
        entry: pnpm -C src/front-end run lint
        # also on dependency, tsconfig and tool-config changes: typed linting reads them
        files: &front-end-inputs |
          (?x)^(
            src/front-end/(.*\.(ts|js|svelte)|(package|tsconfig)\.json)
            |pnpm-lock\.yaml
            |tsconfig\.base\.json
          )$
        pass_filenames: false
      - id: front-end-svelte-check
        name: svelte-check (src/front-end)
        language: system
        entry: pnpm -C src/front-end run check
        files: *front-end-inputs
        pass_filenames: false
