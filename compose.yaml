# pattern: keys are sorted alphabetically
# The rel images, from the Containerfile's last stage. COMPOSE_FILE adds etc/compose/targets/dev.yaml for dev mode.
services:
  api:
    build:
      context: ./src/back-end
      dockerfile: Containerfile
      platforms: ['${BUDGE_PLATFORM:-linux/arm64}']
      x-bake:
        output: type=docker
    depends_on:
      minio:
        condition: service_healthy
    environment: &backend-environment
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-budge-local}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ENDPOINT_URL_S3: ${BUDGE_S3_ENDPOINT:-http://minio:9000}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-budge-local-password}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
    healthcheck:
      interval: 5s
      retries: 12
      # The emulator crashes when invocations overlap, so only the first passing probe calls the handler; later probes
      # check that the emulator is listening. A handler's failure is in the response body, not the HTTP status.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, os, socket, sys, urllib.request
          marker = '/tmp/budge-api-handler-passed'
          if os.path.exists(marker):
              socket.create_connection(('127.0.0.1', 8080), 2).close()
              sys.exit()
          event = {
              'version': '2.0',
              'rawPath': '/api/health',
              'rawQueryString': '',
              'headers': {},
              'requestContext': {
                  'http': {'method': 'GET', 'path': '/api/health', 'protocol': 'HTTP/1.1', 'sourceIp': '127.0.0.1'},
              },
          }
          url = 'http://127.0.0.1:8080/2015-03-31/functions/function/invocations'
          response = json.load(urllib.request.urlopen(url, json.dumps(event).encode()))
          if response['statusCode'] != 200:
              sys.exit(1)
          open(marker, 'w').close()
      timeout: 3s
    image: "${BUDGE_IMAGE_PREFIX:-ghcr.io/bryant-finney}/rel/budge:${BUDGE_IMAGE_VERSION:-${BUDGE_VERSION:-0.0.0}}"
    platform: ${BUDGE_PLATFORM:-linux/arm64}

  ingestion:
    build:
      context: ./src/back-end
      dockerfile: Containerfile
      platforms: ['${BUDGE_PLATFORM:-linux/arm64}']
      x-bake:
        output: type=docker
    command: budge.ingestion.handler.handler
    depends_on:
      minio:
        condition: service_healthy
    environment: *backend-environment
    image: "${BUDGE_IMAGE_PREFIX:-ghcr.io/bryant-finney}/rel/budge:${BUDGE_IMAGE_VERSION:-${BUDGE_VERSION:-0.0.0}}"
    platform: ${BUDGE_PLATFORM:-linux/arm64}
    profiles: [lambda]

  minio:
    build:
      args:
        MINIO_COMMIT: ${MINIO_COMMIT:-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a}
      context: ./src/minio
      dockerfile: Containerfile
      platforms: ['${BUDGE_PLATFORM:-linux/arm64}']
      x-bake:
        output: type=docker
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-budge-local-password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-budge-local}
    healthcheck:
      interval: 5s
      retries: 12
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9000/minio/health/live']
      timeout: 3s
    image: ${BUDGE_IMAGE_PREFIX:-ghcr.io/bryant-finney}/dev/minio:${MINIO_RELEASE:-RELEASE.2025-10-15T17-29-55Z}
    platform: ${BUDGE_PLATFORM:-linux/arm64}
    volumes:
      - minio-data:/data

volumes:
  minio-data:
