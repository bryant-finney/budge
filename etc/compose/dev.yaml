services:
  api:
    extends:
      file: etc/compose/targets/${BUDGE_BUILD_TARGET:-dev}.yaml
      service: api-live
    volumes:
      - source: ${BUDGE_REPO_ROOT:-.}
        target: ${BUDGE_REPO_ROOT:-/workspace}
        type: bind
      - read_only: true
        source: ${BUDGE_GIT_COMMON_DIR:-./.git}
        target: ${BUDGE_GIT_COMMON_DIR:-/workspace/.git}
        type: bind
  ingestion:
    volumes:
      - read_only: true
        source: ${BUDGE_REPO_ROOT:-.}/src/back-end
        target: /workspace/src/back-end
        type: bind
