services:
  api:
    working_dir: ${BUDGE_REPO_ROOT:-/workspace}/src/back-end
    command: [uv, run, --frozen, uvicorn, 'budge.api.app:app', --host, 0.0.0.0, --port, '8000', --reload]
    volumes:
      - type: bind
        source: ${BUDGE_REPO_ROOT:-.}
        target: ${BUDGE_REPO_ROOT:-/workspace}
      - type: bind
        source: ${BUDGE_GIT_COMMON_DIR:-./.git}
        target: ${BUDGE_GIT_COMMON_DIR:-/workspace/.git}
        read_only: true
