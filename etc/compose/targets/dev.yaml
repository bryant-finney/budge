# compose.yaml extends this file when BUDGE_BUILD_TARGET is dev or unset, so relative sources start from this directory.
services:
  api:
    command: uvicorn budge.api.app:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/health")']
    volumes:
      - source: ../../..
        target: /workspace
        type: bind
      # A linked worktree's `.git` file names this directory. Without Git, `uv run` writes 0.0.0 to the checkout.
      - read_only: true
        source: ${BUDGE_GIT_COMMON_DIR:-../../../.git}
        target: ${BUDGE_GIT_COMMON_DIR:-/workspace/.git}
        type: bind

  ingestion:
    volumes:
      - read_only: true
        source: ../../../src/back-end
        target: /workspace/src/back-end
        type: bind
