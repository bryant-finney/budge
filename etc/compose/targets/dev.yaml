# compose.yaml extends this file when BUDGE_BUILD_TARGET is dev or unset, so relative sources start from this directory.
services:
  api:
    command: uvicorn budge.api.app:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/health")']
    volumes:
      # The Lambda base image's LAMBDA_TASK_ROOT, which Compose can't read from the image.
      - source: ../../../src/back-end
        target: /var/task
        type: bind

  ingestion:
    # The dev image clears the Lambda base image's entry point.
    entrypoint: /lambda-entrypoint.sh
    volumes:
      - read_only: true
        source: ../../../src/back-end
        target: /var/task
        type: bind
