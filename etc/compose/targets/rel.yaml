# compose.yaml extends this file when BUDGE_BUILD_TARGET is rel.
services:
  api:
    command: ${BUDGE_API_COMMAND:-budge.api.handler.handler}
    entrypoint: ${BUDGE_API_ENTRYPOINT:-/lambda-entrypoint.sh}
    healthcheck:
      # The emulator crashes when invocations overlap, so only the first passing probe calls the handler; later probes
      # check that the emulator is listening. A handler's failure is in the response body, not the HTTP status.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, os, socket, sys, urllib.request
          marker = '/tmp/budge-api-handler-passed'
          if os.path.exists(marker):
              socket.create_connection(('127.0.0.1', 8080), 2).close()
              sys.exit()
          event = {
              'version': '2.0',
              'rawPath': '/api/health',
              'rawQueryString': '',
              'headers': {},
              'requestContext': {
                  'http': {'method': 'GET', 'path': '/api/health', 'protocol': 'HTTP/1.1', 'sourceIp': '127.0.0.1'},
              },
          }
          url = 'http://127.0.0.1:8080/2015-03-31/functions/function/invocations'
          response = json.load(urllib.request.urlopen(url, json.dumps(event).encode()))
          if response['statusCode'] != 200:
              sys.exit(1)
          open(marker, 'w').close()

  # The image runs its installed wheel, so there's no source to mount.
  ingestion: {}
