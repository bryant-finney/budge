[project]
name = "budge"
# the version comes from git tags (`vX.Y.Z`) via `uv-dynamic-versioning`; see `[tool.uv-dynamic-versioning]`
dynamic = ["version"]
description = "Trailing-7-day discretionary spend tracker: FastAPI API and Plaid ingestion Lambdas."
requires-python = ">=3.11"
# compatible-release pins: `~=MAJOR.MINOR` for stable (>=1.0) packages, `~=0.MINOR.PATCH` for 0.x packages
dependencies = [
  "fastapi~=0.143.3",
  "mangum~=0.22.0",
  "pydantic~=2.14",
  # `typing_extensions.override` until the 3.11 floor rises to 3.12 (`typing.override`); direct, not via pydantic
  "typing-extensions~=4.16",
]

[dependency-groups]
dev = [
  "httpx2~=2.13",
  "mypy~=2.4",
  "pylint-per-file-ignores~=4.0",
  "pylint~=4.1",
  "pyright~=1.1.414",
  "pytest-clarity~=1.0",
  "pytest-cov~=7.1",
  "pytest-mock~=3.17",
  "pytest~=9.1",
  "ruff~=0.17.1",
  "ty~=0.0.89",
  "uvicorn[standard]~=0.54.0",
]

[build-system]
# hatchling, not `uv_build`: `uv-dynamic-versioning` doesn't support the uv build backend (astral-sh/uv#14561)
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]

[tool.coverage.report]
exclude_also = [
  'if TYPE_CHECKING:',
  '^\s*\.\.\.\s*$',
  'raise NotImplementedError',
]
fail_under = 90
show_missing = true

[tool.coverage.run]
branch = true
# coverage defaults to the `sysmon` core on Python >= 3.14, which can't record the per-test dynamic contexts that
# `--cov-context=test` switches at runtime (CoverageWarning `no-sysmon-context`, fatal under `filterwarnings = error`)
core = "ctrace"
# generated by the hatch `version` build hook; it exists only after a build or `uv sync`
omit = ["budge/_version.py"]
source = ["budge"]

[tool.mypy]
disallow_untyped_decorators = true
# `strict` omits these checks; require coded ignores and catch unsafe control flow / dropped awaitables.
enable_error_code = [
  # an override must say so with `@override`, so a renamed or removed base method can't leave it silently orphaned
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "unused-awaitable",
]
files = ["budge", "tests"]
# Lambda runs on Linux; keep local and CI platform branches identical.
platform = "linux"
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.11"
show_error_codes = true
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# pylint isn't a gate, but wherever it runs (e.g. an editor) it agrees with ruff by one rule: a default pylint message
# whose ruff counterpart is enabled in `[tool.ruff.lint]` is disabled here and left to ruff (mapping from
# astral-sh/ruff#970 and ruff's `PL*` codes); a message whose counterpart isn't enabled stays on with ruff's option
# values. Messages without a ruff counterpart keep pylint's defaults. Re-check the list when `select` changes.
# One exception, by the user's decision (2026-10-25): pylint's naming checks stay on beside pep8-naming (`N`), with the
# naming styles in `[tool.pylint.basic]` set to pep8-naming's conventions
[tool.pylint.main]
# pylint has no per-directory or per-file message control of its own; this plugin adds `per-file-ignores`
load-plugins = ["pylint_per_file_ignores"]
py-version = "3.11"                        # ruff `target-version`

[tool.pylint.basic]
argument-naming-style = "snake_case" # N803
class-naming-style = "PascalCase"    # N801
function-naming-style = "snake_case" # N802
# pylint's default short names that pep8-naming also allows (`Run`, which N802 rejects, is dropped)
good-names = ["_", "ex", "i", "j", "k"]
method-naming-style = "snake_case"      # N802
module-naming-style = "snake_case"      # N999
variable-naming-style = "snake_case"    # N806
# pylint's other name types (const, class-const, class-attribute, attr, inlinevar, TypeVar) keep pylint's defaults: no
# pep8-naming rule states a style for them (N815/N816 only reject mixedCase, which ruff checks)

# ruff `lint.pylint.max-*` values for counterparts that are preview-only in ruff, hence off
[tool.pylint.design]
max-bool-expr = 5       # PLR0916 (`max-bool-expr`)
max-locals = 15         # PLR0914 (`max-locals`)
max-public-methods = 20 # PLR0904 (`max-public-methods`)

