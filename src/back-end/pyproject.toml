[project]
name = "budge"
# the version comes from git tags (`vX.Y.Z`) via `uv-dynamic-versioning`; see `[tool.uv-dynamic-versioning]`
dynamic = ["version"]
description = "Trailing-7-day discretionary spend tracker: FastAPI API and Plaid ingestion Lambdas."
requires-python = ">=3.11"
# compatible-release pins: `~=MAJOR.MINOR` for stable (>=1.0) packages, `~=0.MINOR.PATCH` for 0.x packages
dependencies = ["fastapi~=0.143.3", "mangum~=0.22.0", "pydantic~=2.14"]

[dependency-groups]
dev = [
  "httpx~=0.28.1",
  "pytest-clarity~=1.0",
  "pytest-cov~=7.1",
  "pytest-mock~=3.17",
  "pytest~=9.1",
]

[build-system]
# hatchling, not `uv_build`: `uv-dynamic-versioning` doesn't support the uv build backend (astral-sh/uv#14561)
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]

[tool.coverage.report]
exclude_also = [
  'if TYPE_CHECKING:',
  '^\s*\.\.\.\s*$',
  'raise NotImplementedError',
]
fail_under = 90
show_missing = true

[tool.coverage.run]
branch = true
# coverage defaults to the `sysmon` core on Python >= 3.14, which can't record the per-test dynamic contexts that
# `--cov-context=test` switches at runtime (CoverageWarning `no-sysmon-context`, fatal under `filterwarnings = error`)
core = "ctrace"
# generated by the hatch `version` build hook; it exists only after a build or `uv sync`
omit = ["budge/_version.py"]
source = ["budge"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--cov",
  "--cov-context=test",
  "--cov-report=term-missing",
  "-m",
  "not integration",
]
filterwarnings = ["error"]
markers = [
  "integration: needs real Plaid Sandbox or a container; excluded by default",
]
testpaths = ["budge", "tests"]
xfail_strict = true

# write the resolved version to the gitignored `budge/_version.py` on every build, editable installs included; the
# hook also adds it to each target's `artifacts`, so the wheel and sdist ship it although git ignores it. Its `pattern`
# mode is avoided on purpose: that rewrites a tracked file in the working tree and never reverts it
[tool.hatch.build.hooks.version]
path = "budge/_version.py"
template = '''"""The `budge` version, written at build time by hatchling's `version` hook. Generated: do not edit or commit."""

__version__: str = '{version}'
'''

[tool.hatch.build.targets.wheel]
# flat layout: the package lives at `src/back-end/budge/`, not under a nested `src/`
packages = ["budge"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv]
# the version is dynamic, so a new commit or tag must rebuild the editable install to refresh `budge.__version__`
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
required-version = ">=0.13,<0.14"

# Dunamai's default pattern matches the repo-wide `v*` release tags, so no `pattern`/`pattern-prefix` is set
[tool.uv-dynamic-versioning]
bump = true
# used only when there's no `.git` (e.g. the Docker build context); with no tags, git still yields a 0.0.x dev version
fallback-version = "0.0.0"
style = "pep440"
vcs = "git"
