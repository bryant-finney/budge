# `pylint_per_file_ignores` globs, resolved against pylint's cwd: `src/back-end`, or the repo root with
# `--rcfile src/back-end/pyproject.toml`. pytest injects fixtures by parameter name, so a test that takes a module-level
# fixture always shadows it; no ruff rule covers W0621, and it stays on for `budge/`
per-file-ignores = [
  "tests/**/*.py:redefined-outer-name",
  "src/back-end/tests/**/*.py:redefined-outer-name",
]

[tool.pylint.refactoring]
max-nested-blocks = 5 # PLR1702 (`lint.pylint.max-nested-blocks`; preview-only in ruff, hence off)

[tool.pylint.variables]
# ruff `lint.dummy-variable-rgx`, which the unused-argument rules use (ARG001-ARG005; `ARG` isn't selected)
ignored-argument-names = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[tool.pyright]
# pyright otherwise honours mypy's `# type: ignore[code]` as a blanket ignore of every pyright rule on that line;
# suppress pyright findings with `# pyright: ignore[rule]` instead
enableTypeIgnoreComments = false
include = ["budge", "tests"]
# Lambda runs on Linux; keep local and CI platform branches identical (as mypy's `platform` and ty's `python-platform`)
pythonPlatform = "Linux"
pythonVersion = "3.11"
# pyright's twin of mypy's `explicit-override` (off even in strict): an override must say so with `@override`
reportImplicitOverride = "error"
# strict mode leaves stale `# pyright: ignore[...]` comments unreported (mypy's `warn_unused_ignores` covers mypy's)
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ty.analysis]
# Keep mypy suppressions independent; ty findings must use `# ty: ignore[rule]`.
respect-type-ignore-comments = false

[tool.ty.environment]
# Match Lambda and mypy regardless of the developer's host platform.
python-platform = "linux"
python-version = "3.11"

[tool.ty.rules]
# Every ty suppression must name a valid rule and remain necessary.
blanket-ignore-comment = "error"
invalid-ignore-comment = "error"
unused-ignore-comment = "error"

[tool.ty.src]
include = ["budge", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--cov",
  "--cov-context=test",
  "--cov-report=term-missing",
  "-m",
  "not integration",
]
filterwarnings = [
  "error",
  # mangum 0.22's constructor probes `asyncio.get_event_loop()` and creates a loop if there is none; on Python
  # 3.12-3.13 that probe warns when no loop is set yet (as when `budge.api.handler` is imported in a fresh process)
  "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]
markers = [
  "integration: needs real Plaid Sandbox or a container; excluded by default",
]
testpaths = ["budge", "tests"]
xfail_strict = true

# write the resolved version to the gitignored `budge/_version.py` on every build, editable installs included; the
# hook also adds it to each target's `artifacts`, so the wheel and sdist ship it although git ignores it. Its `pattern`
# mode is avoided on purpose: that rewrites a tracked file in the working tree and never reverts it
[tool.hatch.build.hooks.version]
path = "budge/_version.py"
template = '''"""The `budge` version, written at build time by hatchling's `version` hook. Generated: do not edit or commit."""

__version__: str = '{version}'
'''

[tool.hatch.build.targets.wheel]
# flat layout: the package lives at `src/back-end/budge/`, not under a nested `src/`
packages = ["budge"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint]
select = [
  "B",
  "C90",
  "D",
  "E1",
  "E4",
  "E501",
  "E7",
  "E9",
  "ERA",
  "F",
  "G",
  "I",
  "N",
  # blanket `# type: ignore` / `# noqa` only (not all of `PGH`): every suppression names its code
  "PGH003",
  "PGH004",
  "PL",
  "PT",
  "RET",
  "RUF",
  "S",
  "T20",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# spec §6: `boto3` / `botocore` may only be imported by the `budge.aws` adapter package
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3".msg = "spec §6: only the `budge.aws` adapter package may import boto3; depend on the storage/ingestion protocols"
"botocore".msg = "spec §6: only the `budge.aws` adapter package may import botocore; depend on the storage/ingestion protocols"

# explicit, because a nested config (e.g. `tests/ruff.toml`) moves ruff's project root and `budge` would sort as
# third-party there
[tool.ruff.lint.isort]
known-first-party = ["budge"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# the AWS adapter package is the one place boto3/botocore are allowed (spec §6)
"budge/aws/**" = ["TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# the version is dynamic, so a new commit or tag must rebuild the editable install to refresh `budge.__version__`
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
required-version = ">=0.13,<0.14"

# Dunamai's default pattern matches the repo-wide `v*` release tags, so no `pattern`/`pattern-prefix` is set
[tool.uv-dynamic-versioning]
bump = true
# used only when there's no `.git` (e.g. the Docker build context); with no tags, git still yields a 0.0.x dev version
fallback-version = "0.0.0"
style = "pep440"
vcs = "git"
